; DKIM configuration (haraka-plugin-dkim >= 1.x uses [sign]/[verify] sections).
; Keys are looked up per sending domain in config/dkim/<domain>/{private,selector}.
[sign]
enabled=true
headers=From, Sender, Reply-To, Subject, Date, Message-ID, To, Cc, MIME-Version

; Verification is pointless for our own outbound mail and races with
; queue/deliver ("Cannot pipe while currently piping"), crashing the worker.
[verify]
enabled=false
